name: Build and Release BHTikTok

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL to the decrypted IPA file"
        default: ""
        required: true
        type: string

      display_name:
        description: "App Name (Optional)"
        default: "TikTok"
        required: true
        type: string

      bundle_id:
        description: "BundleID (Optional)"
        default: "com.zhiliaoapp.musically"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build BHTikTok
    runs-on: macos-14
    permissions:
      contents: write

    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_SDK: iPhoneOS16.5.sdk

    steps:
      - name: Checkout Main
        uses: actions/checkout@v5
        with:
          path: main
          submodules: recursive

      - name: Hide sensitive inputs
        uses: levibostian/action-hide-sensitive-inputs@v1

      - name: Validate IPA URL
        run: |
          if [[ -z "${{ inputs.ipa_url }}" ]]; then
            echo "::error::ipa_url is required"
            exit 1
          fi

          if ! [[ "${{ inputs.ipa_url }}" =~ ^https?:// ]]; then
            echo "::error::ipa_url must be a direct http(s) URL"
            exit 1
          fi

          curl -L -r 0-1023 -o sample.part "${{ inputs.ipa_url }}" > /dev/null 2>&1
          file_type=$(file --mime-type -b sample.part)

          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Validation failed: The file is not a valid IPA file. Detected type: $file_type."
            exit 1
          fi

      - name: Install Dependencies
        run: brew install make ldid pipx

      - name: Set PATH environment variable
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix pipx)/bin" >> "$GITHUB_PATH"

      - name: Cache Theos
        id: theos
        uses: actions/cache@v4.3.0
        env:
          cache-name: theos_cache_67db2ab_v2
        with:
          path: theos/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Setup Theos
        if: steps.theos.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: theos/theos
          ref: 67db2ab8d950910161730de77c322658ea3e6b44
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Download iOS SDK
        if: steps.theos.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks/
          cd sdks
          git sparse-checkout set --no-cone "$THEOS_SDK"
          git checkout
          mkdir -p "$THEOS/sdks"
          mv *.sdk "$THEOS/sdks"

      - name: Ensure Preferences framework stub in Theos SDK
        run: |
          SDK_PATH="$THEOS/sdks/$THEOS_SDK"
          DEST_DIR="$SDK_PATH/System/Library/PrivateFrameworks/Preferences.framework"
          DEST_TBD="$DEST_DIR/Preferences.tbd"

          mkdir -p "$DEST_DIR"

          PREF_SRC=""
          IOS_SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          SIM_SDK_PATH="$(xcrun --sdk iphonesimulator --show-sdk-path)"

          for candidate in \
            "$IOS_SDK_PATH/System/Library/PrivateFrameworks/Preferences.framework/Preferences.tbd" \
            "$SIM_SDK_PATH/System/Library/PrivateFrameworks/Preferences.framework/Preferences.tbd"
          do
            if [[ -f "$candidate" ]]; then
              PREF_SRC="$candidate"
              break
            fi
          done

          if [[ -z "$PREF_SRC" ]]; then
            echo "::error::Could not locate Preferences.tbd in Xcode SDKs on runner"
            exit 1
          fi

          cp "$PREF_SRC" "$DEST_TBD"
          echo "Installed Preferences.tbd from: $PREF_SRC"
          ls -la "$DEST_DIR"

      - name: Install cyan
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Download TikTok IPA
        run: wget "${{ inputs.ipa_url }}" --no-verbose -O "${{ github.workspace }}/main/tiktok.ipa"

      - name: Build Tweak for Sideloading
        run: |
          cd "${{ github.workspace }}/main"
          make clean package SIDELOADING=1

      - name: Inject tweak into provided IPA
        run: |
          cd "${{ github.workspace }}/main/packages"
          tweak_package=$(ls *.deb | head -n 1)
          cd "${{ github.workspace }}/main"
          cyan -i tiktok.ipa -o packages/BHTikTok.ipa -uwsf "packages/$tweak_package" -n "${{ inputs.display_name }}" -b "${{ inputs.bundle_id }}"

      - name: Create Release
        uses: softprops/action-gh-release@v2.4.1
        with:
          name: BHTikTok-v${{ github.run_number }}
          files: main/packages/*.ipa
          draft: true

      - name: Output Release URL
        run: |
          echo "::notice::Release available at: https://github.com/${{ github.repository }}/releases"
